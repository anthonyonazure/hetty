name: Lint
on:
  push:
  pull_request:
  workflow_dispatch:
  # Re-check on a clock. Code that has not changed can still break when a
  # dependency publishes a security release or an action is deprecated.
  schedule:
    - cron: "17 6 * * 1"
defaults:
  run:
    working-directory: ./admin
jobs:
  lint-admin:
    runs-on: ubuntu-latest
    name: Admin (Next.js)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - run: yarn install --frozen-lockfile
      - run: yarn run lint
