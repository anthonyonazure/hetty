# Where are all the schema files located? globs are supported eg  src/**/*.graphqls
schema:
  - pkg/api/schema.graphql

# Where should the generated server code go?
exec:
  filename: pkg/api/generated.go
  package: api

# Uncomment to enable federation
# federation:
#   filename: graph/generated/federation.go
#   package: generated

# Where should any generated models go?
model:
  filename: pkg/api/models_gen.go
  package: api

# There is deliberately no `resolver:` section.
#
# pkg/api/resolvers.go is hand-maintained. It holds more than resolver
# methods: the Resolver struct and its four service dependencies, the HTTP
# protocol lookup maps, and the parse* helpers that convert domain types into
# API types. The resolver generator owns whichever file it writes to. Pointed
# at resolvers.go it emits `type Resolver struct{}` with no fields, moves every
# hand-written declaration into a trailing comment block, and the package stops
# compiling. It preserves the resolver method bodies; it does not preserve
# anything else in the file.
#
# So generation covers the exec layer and the models only, and resolvers.go is
# treated as source rather than scaffolding. When the schema gains a field,
# `go generate ./...` regenerates generated.go, the build then fails on the
# missing resolver method, and it gets written by hand. That is a loud failure
# at build time, which is the behaviour worth having.

# Optional: turn on use `gqlgen:"fieldName"` tags in your models
# struct_tag: json

# Optional: turn on to use []Thing instead of []*Thing
omit_slice_element_pointers: true
# Optional: set to speed up generation time by not performing a final validation pass.
# skip_validation: true

# gqlgen will search for any type names in the schema in these go packages
# if they match it will use them, otherwise it will generate them.
# autobind:
#   - "github.com/dstotijn/hetty/graph/model"

# This section declares type mapping between the GraphQL and go type systems
#
# The first line in each type will be used as defaults for resolver arguments and
# modelgen, the others will be allowed when binding to fields. Configure them to
# your liking
models:
  ID:
    model:
      - github.com/dstotijn/hetty/pkg/api.ULID
  URL:
    model:
      - github.com/dstotijn/hetty/pkg/api.URL
#   Int:
#     model:
#       - github.com/99designs/gqlgen/graphql.Int
#       - github.com/99designs/gqlgen/graphql.Int64
#       - github.com/99designs/gqlgen/graphql.Int32
